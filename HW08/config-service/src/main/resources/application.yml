server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Для локальной разработки читает из classpath:/config
          # В Kubernetes монтируется ConfigMap в /config-repo
          search-locations: ${CONFIG_SEARCH_LOCATIONS:classpath:/config,file:/config-repo}
  output:
    ansi:
      enabled: ALWAYS


# Actuator конфигурация
management:
  endpoints:
    web:
      exposure:
        include: health,info,logfile,liquibase,metrics,prometheus
      base-path: /actuator
    endpoint:
      health:
        show-details: always
        show-components: always
      metrics:
        enabled: true
      logfile:
        enabled: true
      prometheus:
        enabled: true

  # Метрики конфигурация
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      processor: true
      system: true
    distribution:
      slo:
        http.server.requests: 10ms, 50ms, 100ms, 200ms, 300ms, 400ms, 500ms, 600ms, 800ms
      percentiles-histogram:
        http.server.requests: true

    # Экспорт метрик в Prometheus
    export:
      prometheus:
        enabled: true
        step: 1m
        descriptions: true

    # Тэги для метрик
    tags:
      application: ${spring.application.name}
      region: local

    # Web метрики
    web:
      server:
        request:
          autotime:
            enabled: true
          metric-name: http.server.requests

# SpringDoc (OpenAPI) конфигурация
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  messages:
    baseName: messages
    encoding: UTF-8
    fallbackToSystemLocale: false
    use-code-as-default-message: true
  enable-hateoas: false

logging:
  level:
    com.microservices: INFO
    org.springframework.cloud.config: DEBUG
