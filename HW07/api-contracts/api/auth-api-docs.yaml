                $ref: "#/components/schemas/AuthTokenValidationResponse"
  /auth/validate:
    post:
      tags:
      - auth-controller
      operationId: validateToken_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthValidateTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /auth/register:
    post:
      tags:
      - auth-controller
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
