openapi: 3.0.3
info:
  title: Order API
  version: 1.0.0

paths: {}

components:
  schemas:
    OrderRequest:
      type: object
      required:
        - userId
        - productId
      properties:
        userId:
          type: string
          description: Идентификатор пользователя
        productId:
          type: string
          description: Идентификатор товара
        quantity:
          type: integer
          minimum: 1
          default: 1

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum: [CREATED, PAID, CANCELLED]