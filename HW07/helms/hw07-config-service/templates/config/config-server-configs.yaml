          order-events: order.events


  # Конфиг для order-service
  order-service.yml: |
    server:
      port: 8084

    spring:
      application:
        name: order-service
      datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:microservices_db}
