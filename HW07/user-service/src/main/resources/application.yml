# Локальная конфигурация (используется только если config-service недоступен)
# Основная конфигурация загружается из config-service
server:
  port: 8082


spring:
  application:
    name: user-service

  config:
    import: optional:configserver:http://${CONFIG_SERVICE_HOST:config-service}:${CONFIG_SERVICE_PORT:8888}

  cloud:
    config:
      enabled: ${CONFIG_SERVICE_ENABLED:true}
      fail-fast: true
      retry:
        initial-interval: 1000 # 10 секунд
        max-attempts: 6 # 6 попыток
        max-interval: 10000 # 10 секунд
        multiplier: 1.5 # Увеличение интервала между попытками


