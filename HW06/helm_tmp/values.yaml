namespace: microservices

imageRegistry: ""
imagePullPolicy: IfNotPresent

apiGateway:
  image:
    repository: api-gateway
    tag: "1.0.0"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

authService:
  image:
    repository: auth-service
    tag: "1.0.0"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

userService:
  image:
    repository: user-service
    tag: "1.0.0"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

configService:
  image:
    repository: config-service
    tag: "1.0.0"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8888
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  database: microservices_db
  username: postgres
  password: postgres
  service:
    type: ClusterIP
    port: 5432

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: arch.homework
      paths:
        - path: /
          pathType: Prefix
  tls: []

jwt:
  secret: mySecretKeyForJWTTokenGenerationThatShouldBeAtLeast256BitsLong

