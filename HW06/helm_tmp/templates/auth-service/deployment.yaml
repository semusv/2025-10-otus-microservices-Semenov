apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices-app.fullname" . }}-auth-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth-service
spec:
  replicas: {{ .Values.authService.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservices-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: auth-service
  template:
    metadata:
      labels:
        {{- include "microservices-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: auth-service
    spec:
      containers:
      - name: auth-service
        image: "{{ .Values.imageRegistry }}{{ .Values.authService.image.repository }}:{{ .Values.authService.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8081
          protocol: TCP
        env:
        - name: CONFIG_SERVICE_HOST
          value: "{{ include "microservices-app.fullname" . }}-config-service"
        - name: CONFIG_SERVICE_PORT
          value: "{{ .Values.configService.service.port }}"
        - name: CONFIG_SERVICE_ENABLED
          value: "true"
        - name: DB_HOST
          value: "{{ include "microservices-app.fullname" . }}-postgresql"
        - name: DB_PORT
          value: "{{ .Values.postgresql.service.port }}"
        - name: DB_NAME
          value: {{ .Values.postgresql.database }}
        - name: DB_USER
          value: {{ .Values.postgresql.username }}
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "microservices-app.fullname" . }}-postgresql-secret
              key: password
        - name: JWT_SECRET
          value: {{ .Values.jwt.secret | quote }}
        resources:
          {{- toYaml .Values.authService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 40
          periodSeconds: 5
      initContainers:
      - name: wait-for-config-service
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z {{ include "microservices-app.fullname" . }}-config-service {{ .Values.configService.service.port }}; do echo waiting for config-service; sleep 2; done;']

