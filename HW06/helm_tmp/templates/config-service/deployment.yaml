apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices-app.fullname" . }}-config-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-service
spec:
  replicas: {{ .Values.configService.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservices-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: config-service
  template:
    metadata:
      labels:
        {{- include "microservices-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: config-service
    spec:
      containers:
      - name: config-service
        image: "{{ .Values.imageRegistry }}{{ .Values.configService.image.repository }}:{{ .Values.configService.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8888
          protocol: TCP
        env:
        - name: CONFIG_SEARCH_LOCATIONS
          value: "file:/config-repo"
        volumeMounts:
        - name: config-repo
          mountPath: /config-repo
          readOnly: true
        resources:
          {{- toYaml .Values.configService.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
      volumes:
      - name: config-repo
        configMap:
          name: {{ include "microservices-app.fullname" . }}-config-repo

