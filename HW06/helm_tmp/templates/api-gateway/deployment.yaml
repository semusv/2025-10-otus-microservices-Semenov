apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices-app.fullname" . }}-api-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "microservices-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "microservices-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "microservices-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: "{{ .Values.imageRegistry }}{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: CONFIG_SERVICE_HOST
          value: "{{ include "microservices-app.fullname" . }}-config-service"
        - name: CONFIG_SERVICE_PORT
          value: "{{ .Values.configService.service.port }}"
        - name: CONFIG_SERVICE_ENABLED
          value: "true"
        - name: AUTH_SERVICE_HOST
          value: "{{ include "microservices-app.fullname" . }}-auth-service"
        - name: AUTH_SERVICE_PORT
          value: "{{ .Values.authService.service.port }}"
        - name: USER_SERVICE_HOST
          value: "{{ include "microservices-app.fullname" . }}-user-service"
        - name: USER_SERVICE_PORT
          value: "{{ .Values.userService.service.port }}"
        resources:
          {{- toYaml .Values.apiGateway.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
      initContainers:
      - name: wait-for-config-service
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z {{ include "microservices-app.fullname" . }}-config-service {{ .Values.configService.service.port }}; do echo waiting for config-service; sleep 2; done;']

