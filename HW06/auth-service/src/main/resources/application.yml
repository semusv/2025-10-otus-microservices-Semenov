# Локальная конфигурация (используется только если config-service недоступен)
# Основная конфигурация загружается из config-service
server:
  port: 8081

spring:
  application:
    name: auth-service

  config:
    import: optional:configserver:http://${CONFIG_SERVICE_HOST:config-service}:${CONFIG_SERVICE_PORT:8888}

  output:
    ansi:
      enabled: ALWAYS

  cloud:
    config:
      enabled: ${CONFIG_SERVICE_ENABLED:true}
      uri: http://${CONFIG_SERVICE_HOST:config-service}:${CONFIG_SERVICE_PORT:8888}
      fail-fast: false
      retry:
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1


logging:
  level:
    org.springframework.boot.context.properties: DEBUG
    org.springframework.context.annotation: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    # или TRACE для детальной информации
    org.springframework.boot: TRACE
    org.springframework.context: TRACE